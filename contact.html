<body class="dark-mode">

    <main class="container" style="padding-top: 160px; padding-bottom: 100px;">
        <div class="text-center mb-5 reveal">
            <span class="badge-status text-uppercase mb-3">Get In Touch</span>
            <h1 class="main-title">Let's <span class="text-neon">Connect</span></h1>
        </div>

        <section class="master-contact-bingkai reveal mb-huge">
            <div class="row g-5 align-items-center">
                
                <div class="col-lg-5 d-flex justify-content-center" style="perspective: 1500px; position: relative; min-height: 550px;">
                    <div class="nametag-physics-wrapper" id="interactive-nametag">
                        <div class="nametag-card">
                            <div class="nametag-face nametag-front id-replica-dark">
                                <div class="id-inner-border">
                                    <div class="id-header">
                                        <div class="id-brand text-neon">Wyn.Faldy</div>
                                    </div>
                                    <div class="id-yellow-badge">FULL-STACK DEVELOPER</div>

                                        <img src="fullface.jpeg" alt="Faldy" class="id-photo-img">

                                    <div class="id-footer">

                                    </div>
                                </div>
                            </div>
                            
                            <div class="nametag-face nametag-back">
                                <h5 class="fw-bold text-neon mb-3">SCAN TO CONNECT</h5>
                                <div class="qr-box">
                                    <i class="fa-solid fa-qrcode" style="font-size: 6rem; color: #fff;"></i>
                                </div>
                                <p class="mt-3 mb-0 text-uppercase" style="font-size: 0.7rem; color: #aaa; letter-spacing: 2px;">ID: DEV-2026</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="contact-box-outline h-100">
                        <h3 class="fw-bold mb-4" style="color: var(--text);">Send Me a Message</h3>
                        
                        <form action="https://formspree.io/f/xnjoeqpg" method="POST" id="my-contact-form">
                            <div class="row g-3">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label opacity-75">Your Name</label>
                                    <input type="text" name="name" class="form-control custom-input" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label opacity-75">Your Email</label>
                                    <input type="email" name="email" class="form-control custom-input" placeholder="john@example.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label opacity-75">Subject</label>
                                <input type="text" name="subject" class="form-control custom-input" placeholder="Job Inquiry / Say Hi" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label opacity-75">Message</label>
                                <textarea name="message" class="form-control custom-input" rows="5" placeholder="Hello Faldy, I would like to discuss..." required></textarea>
                            </div>
                            
                            <div id="form-status" class="alert d-none mb-3" role="alert"></div>

                            <button type="submit" id="submit-btn" class="btn-pill btn-outline border-0 w-100">
                                Send Message <i class="fas fa-paper-plane ms-2"></i>
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </section>

        <section class="reveal mt-heavy">
            <div class="contact-info-footer-box py-4 px-5">
                <div class="row align-items-center">
                    <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
                        <h4 class="fw-bold mb-0">Direct Contact</h4>
                        <p class="mb-0 small opacity-75">Reach me anytime</p>
                    </div>
                    <div class="col-md-8">
                        <div class="d-flex align-items-center justify-content-center justify-content-md-end gap-3 flex-wrap">
                            <a href="mailto:faldy231@gmail.com" class="icon-box" title="Email"><i class="fas fa-envelope"></i></a>
                            <a href="https://wa.me/6281388294640" target="_blank" class="icon-box" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                            <a href="https://www.instagram.com/faldy_666?igsh=MXNzbzhrZjR1OGZieg%3D%3D&utm_source=qr" target="_blank" class="icon-box" title="Instagram"><i class="fab fa-instagram"></i></a>
                            <a href="https://www.linkedin.com/in/i-wayan-faldy-prayudi-108bb338a?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=ios_app" target="_blank" class="icon-box" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                            <a href="https://github.com/FaldyHorus" target="_blank" class="icon-box" title="GitHub"><i class="fab fa-github"></i></a>
                            <a href="https://discord.com/app" target="_blank" class="icon-box" title="Discord: wyn_faldy" onclick="navigator.clipboard.writeText('wyn_faldy'); alert('Discord Username \'wyn_faldy\' berhasil di-copy! Silakan paste di menu Add Friend Discord.');"><i class="fab fa-discord"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    
    <script src="script.js"></script>

    <script>
        const contactForm = document.getElementById("my-contact-form");
        const statusMessage = document.getElementById("form-status");
        const submitBtn = document.getElementById("submit-btn");

        contactForm.addEventListener("submit", async function(event) {
            event.preventDefault(); 
            
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Sending... <i class="fas fa-spinner fa-spin ms-2"></i>';
            submitBtn.disabled = true;

            const formData = new FormData(contactForm);

            try {
                const response = await fetch(contactForm.action, {
                    method: contactForm.method,
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMessage.className = "alert alert-success d-block";
                    statusMessage.innerHTML = "Pesan berhasil terkirim! Saya akan segera membalasnya.";
                    contactForm.reset(); 
                } else {
                    statusMessage.className = "alert alert-danger d-block";
                    statusMessage.innerHTML = "Oops! Ada masalah saat mengirim pesan.";
                }
            } catch (error) {
                statusMessage.className = "alert alert-danger d-block";
                statusMessage.innerHTML = "Gagal terhubung. Pastikan internet Anda aktif.";
            }

            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
            
            setTimeout(() => {
                statusMessage.classList.remove("d-block");
                statusMessage.classList.add("d-none");
            }, 5000);
        });
    </script>

</body>
</html>
